[settings]
experimental = true


[tools]
node = "24.16.0"
pnpm = "12"
python = "3.13.12"

[hooks]
postinstall = [
	"mise run setup:all",
	"echo 'setup complete!'",
	"echo 'check out the CONTRIBUTING.md file for more developer info!'",
]

[shell_alias]
nx = "pnpm dlx nx"
compose = "docker compose"

[tasks."setup:all"]
description = "Setup all submodules and install dependencies"
depends = ["setup:deps", "setup:virtual-klipper"]

[tasks."setup:deps"]
description = "Setup node dependencies"
run = [
	"echo installing node modules",
	"pnpm install --frozen-lockfile",
	"echo 'node modules installed!'",
]

[tasks."setup:virtual-klipper"]
description = "Setup virtual klipper printer testing submodule"
run = [
	"echo 'setting up virtual klipper printer testing submodule'",
	"git submodule update --init --recursive",
	"echo 'virtual klipper printer testing submodule setup complete!'",
]

[tasks.build-klipper]
description = "Build virtual klipper docker image"
run = "docker compose build"

[tasks.upgrade-nx]
description = "Upgrade dependencies and tools"
run = "pnpm dlx nx migrate latest && pnpm install && pnpm dlx nx migrate --run-migrations"

[env]
NODE_ENV = "development"
KLIPPER_REPO = "https://github.com/Klipper3d/klipper.git"
