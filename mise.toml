[settings]
experimental = true


[tools]
node = "26.13.1"
pnpm = "12"
python = "3.13.12"

[hooks]
postinstall = [
	"mise run setup:all",
	"echo 'setup complete!'",
	"echo 'check out the CONTRIBUTING.md file for more developer info!'",
]

[shell_alias]
nx = "pn nx"
compose = "docker compose"

[tasks."setup:all"]
description = "Setup all submodules and install dependencies"
depends = ["setup:deps", "setup:submodules"]

[tasks."setup:deps"]
description = "Setup node dependencies"
run = [
	"echo installing node modules",
	"pnpm install --frozen-lockfile",
	"echo 'node modules installed!'",
]

[tasks.list-submodules]
description = "List all submodules used by this project"
run = ["git submodule status --recursive"]

[tasks."setup:submodules"]
description = "Setup submodules used by this project for build and testing"
run = ["git submodule update --init --recursive"]

[tasks.build-klipper]
description = "Build virtual klipper docker image"
run = "docker compose build"

[tasks.upgrade-nx]
description = "Upgrade dependencies and tools"
run = "pnpm dlx nx migrate latest && pnpm install && pnpm dlx nx migrate --run-migrations"

[env]
KLIPPER_REPO = "https://github.com/Klipper3d/klipper.git"
